# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name aliboboqurilish.uz www.aliboboqurilish.uz;

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name aliboboqurilish.uz www.aliboboqurilish.uz;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/aliboboqurilish.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliboboqurilish.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ===== FRONTEND (React build) =====
    location / {
        root /opt/alibobo/build;
        index index.html;
        try_files $uri /index.html;
        
        # Security headers (NO CORS headers here to avoid duplication)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    }

    # ===== BACKEND (API) =====
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers - ONLY SET ONCE with specific origins to avoid duplication
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        if ($http_origin ~* "^https://(www\.)?aliboboqurilish\.uz$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        if ($http_origin ~* "^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Max-Age 86400;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ===== SOCKET.IO =====
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Critical settings for Socket.IO to work properly
        proxy_buffering off;
        proxy_set_header Origin "";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # CORS headers for Socket.IO - ONLY SET ONCE with specific origins
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        if ($http_origin ~* "^https://(www\.)?aliboboqurilish\.uz$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        if ($http_origin ~* "^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        add_header Access-Control-Allow-Credentials "true";
    }

    # ===== UPLOADS =====
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers for uploads - ONLY SET ONCE with specific origins
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        if ($http_origin ~* "^https://(www\.)?aliboboqurilish\.uz$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        if ($http_origin ~* "^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
            add_header Access-Control-Allow-Origin $http_origin;
        }
        
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
        add_header Access-Control-Allow-Credentials "true";
    }

    # ===== HEALTH CHECK =====
    location /health {
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}