version: '3.8'

services:
  mongodb:
    image: mongo:5
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - alibobo-dev

  app:
    build: .
    ports:
      - "5001:5001"
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:password@mongodb:27017/alibobo?authSource=admin
      JWT_SECRET: dev-secret-key
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5001
      LOG_LEVEL: debug
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
    networks:
      - alibobo-dev
    command: npm run dev

volumes:
  mongodb_data:

networks:
  alibobo-dev:
    driver: bridge
